name: Pipeline 2 - Docker, Security & Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      # Only app code — do not trigger on k8s/gatus (ArgoCD owns that; avoids CI loops)
      - "gatus/**"
      - ".github/workflows/docker-deploy.yml"

permissions:
  id-token: write
  contents: write

env:
  AWS_REGION: eu-north-1
  ECR_REPOSITORY: gatus-app

jobs:
  deploy:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkov scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra
          framework: terraform
          soft_fail: true
          skip_check: CKV_AWS_355,CKV_AWS_79,CKV_AWS_39,CKV_AWS_58,CKV_AWS_38,CKV_AWS_338,CKV_AWS_158,CKV_AWS_51,CKV_AWS_136

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-skip-session-tagging: true

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_REGION" \
            || aws ecr create-repository --repository-name "$ECR_REPOSITORY" --region "$AWS_REGION"

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          IMAGE=$REGISTRY/$ECR_REPOSITORY:${{ github.sha }}
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"
          docker build -t "$IMAGE" ./gatus

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}
          format: table
          exit-code: "0"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Push image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag "$IMAGE" "$REGISTRY/$ECR_REPOSITORY:latest"
          docker push "$IMAGE"
          docker push "$REGISTRY/$ECR_REPOSITORY:latest"

      # GitOps: CI updates the desired image in Git; ArgoCD rolls it out on the cluster.
      - name: Update image tag in Git for ArgoCD
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only replace the container image line under the gatus Deployment
          sed -i -E "s|^([[:space:]]*image:).*|\1 ${IMAGE}|" k8s/gatus/deployment.yaml

          git add k8s/gatus/deployment.yaml
          if git diff --staged --quiet; then
            echo "Image already up to date in Git"
            exit 0
          fi

          git commit -m "ci: update gatus image to ${GITHUB_SHA}"
          git push origin HEAD:main
