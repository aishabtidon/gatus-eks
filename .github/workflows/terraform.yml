name: Pipeline 1 - Terraform

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "infra/**"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-north-1

jobs:
  terraform:
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          audience: sts.amazonaws.com
          role-skip-session-tagging: true

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Prepare tfvars
        run: |
          if [ ! -f terraform.tfvars ]; then
            cp terraform.tfvars.example terraform.tfvars
          fi

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init
        run: terraform init -input=false

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Block EKS cluster destroy/replace
        run: |
          set -euo pipefail
          terraform show -no-color tfplan | tee /tmp/tfplan.txt
          if grep -E 'aws_eks_cluster\.this (must be replaced|will be destroyed)' /tmp/tfplan.txt; then
            echo "::error::Refusing apply: plan would destroy/replace the EKS cluster. Do not re-run old failed Terraform jobs — run a fresh workflow on current main."
            exit 1
          fi

      - name: Terraform apply
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        run: terraform apply -input=false -auto-approve tfplan
