# ClusterIssuer — Let's Encrypt via DNS-01 (Route53)
# Works with Traefik HTTP→HTTPS redirect (no ACME HTTP path conflict)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: aishabtidon@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - dns01:
          route53:
            region: eu-north-1
            hostedZoneID: Z0265538IC6DG39LCZE5
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: aishabtidon@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
      - dns01:
          route53:
            region: eu-north-1
            hostedZoneID: Z0265538IC6DG39LCZE5
