# Minimal Gatus deploy + Ingress (HTTPS via cert-manager + Traefik)
apiVersion: v1
kind: Namespace
metadata:
  name: gatus
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gatus-config
  namespace: gatus
data:
  config.yaml: |
    storage:
      type: memory
    web:
      port: 8080
    endpoints:
      - name: self
        url: "https://eks.gatus-eks.com"
        interval: 5m
        conditions:
          - "[STATUS] == 200"
      - name: GitHub API
        group: External
        url: "https://api.github.com"
        interval: 1m
        conditions:
          - "[STATUS] == 200"
      - name: DNS Resolution
        group: DNS
        url: "8.8.8.8"
        dns:
          query-name: "eks.gatus-eks.com"
          query-type: "A"
        conditions:
          - "[DNS_RCODE] == NOERROR"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gatus
  namespace: gatus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gatus
  template:
    metadata:
      labels:
        app: gatus
    spec:
      containers:
        - name: gatus
          image: twinproduction/gatus:stable
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: config
          configMap:
            name: gatus-config
---
apiVersion: v1
kind: Service
metadata:
  name: gatus
  namespace: gatus
spec:
  selector:
    app: gatus
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gatus
  namespace: gatus
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - eks.gatus-eks.com
      secretName: gatus-tls
  rules:
    - host: eks.gatus-eks.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gatus
                port:
                  number: 80
