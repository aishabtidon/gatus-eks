# Traefik Helm values — AWS NLB front door, HTTP→HTTPS redirect
# Install:
#   helm repo add traefik https://traefik.github.io/charts
#   helm upgrade --install traefik traefik/traefik -n traefik --create-namespace -f k8s/helm/traefik/values.yaml

deployment:
  replicas: 2

service:
  type: LoadBalancer
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
    # ExternalDNS will create eks.gatus-eks.com → NLB
    external-dns.alpha.kubernetes.io/hostname: eks.gatus-eks.com

ports:
  web:
    port: 8000
    expose:
      default: true
    exposedPort: 80
    # Let cert-manager HTTP-01 challenges through despite HTTPS redirect
    allowACMEByPass: true
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    port: 8443
    expose:
      default: true
    exposedPort: 443
    http:
      tls:
        enabled: true

ingressClass:
  enabled: true
  isDefaultClass: true

providers:
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: true
  kubernetesIngress:
    enabled: true
    publishedService:
      enabled: true
